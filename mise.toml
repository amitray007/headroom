[tools]
bun = "1.4.2"

[settings]
lockfile = true

[tasks.install]
description = "Install workspace dependencies with the locked versions"
run = "bun install --frozen-lockfile"

[tasks.docs]
description = "Check Markdown links, structure and provider dossiers"
run = "python3 scripts/check_docs.py"

[tasks.format]
description = "Format all files with oxfmt"
run = "bun run format"

[tasks.lint]
description = "Lint with oxlint, type-aware, warnings denied"
run = "bun run lint"

[tasks.typecheck]
description = "Type-check every workspace with tsc"
run = "bun run typecheck"

[tasks.test]
description = "Run bun test across the workspace"
run = "bun run test"

[tasks.knip]
description = "Report unused files, exports and dependencies"
run = "bun run knip"

[tasks.check]
description = "Everything CI runs: docs, format, lint, typecheck, knip, test"
depends = ["docs"]
run = "bun run check"

[tasks.build]
description = "Compile the server into a single binary at dist/headroom"
run = "bun run build"

[tasks.dev]
description = "Run the server with reload"
run = "bun run dev"

[tasks.start]
description = "Build, then run the compiled binary with the environment from .mise.local.toml (data in .data, secrets in .state)"
depends = ["build"]
run = "./dist/headroom"

[tasks.smoke]
description = "Build, then drive the binary through owner sign-up and a cancelled Codex CLI login (needs network and codex on PATH)"
depends = ["build"]
run = "bun scripts/smoke.ts"

[tasks.docker]
description = "Build the container image locally"
run = "docker build -t headroom:dev ."

[tasks."demo:build"]
description = "Build the static demo site (synthetic data, no server) into apps/web/dist-demo"
run = "bun run web:build:demo"
