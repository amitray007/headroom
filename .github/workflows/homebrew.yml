# Renders Formula/headroom.rb for a release and commits it to main. This repo is its own Homebrew tap:
#   brew tap amitray007/headroom https://github.com/amitray007/headroom
#   brew install amitray007/headroom/headroom
# release-please.yml calls it after the binaries are attached; run it by hand to republish a formula.
# See docs/operations/install.md.
name: Homebrew
on:
  workflow_call:
    inputs:
      version:
        description: Release version without the v, such as 0.2.0
        required: true
        type: string
  workflow_dispatch:
    inputs:
      version:
        description: Release version without the v, such as 0.2.0
        required: true
        type: string
permissions: {}
concurrency:
  group: homebrew
  cancel-in-progress: false
jobs:
  formula:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
      - uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492 # v5.0.1
        with:
          version: 2026.9.11
          cache: true
      - name: Download SHA256SUMS
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${VERSION#v}"
          mkdir -p "$RUNNER_TEMP/release"
          gh release download "v${version}" --repo "$GITHUB_REPOSITORY" --pattern SHA256SUMS --dir "$RUNNER_TEMP/release"
      - name: Render the formula
        run: |
          version="${VERSION#v}"
          mkdir -p Formula
          mise exec -- bun scripts/render-formula.ts "$version" "$RUNNER_TEMP/release/SHA256SUMS" > Formula/headroom.rb
          cat Formula/headroom.rb
      # The commit is made with GITHUB_TOKEN, so it starts no other workflow. A chore commit adds nothing to the changelog.
      - name: Commit and push
        run: |
          version="${VERSION#v}"
          if git diff --quiet -- Formula/headroom.rb && [ -z "$(git ls-files --others --exclude-standard Formula/headroom.rb)" ]; then
            echo "::notice::Formula/headroom.rb is already at ${version}."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/headroom.rb
          git commit -m "chore(brew): headroom ${version}"
          # main may have moved while the formula rendered.
          for attempt in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep $((attempt * 5))
          done
          exit 1
