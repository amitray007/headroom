# Builds the npm packages and PyPI wheels from the release binaries of v<version> and publishes them.
# release-please.yml calls it after the binaries are attached; run it by hand to republish a version.
# Publishing stays off until the repo variables NPM_PUBLISH and PYPI_PUBLISH are 'true'. Both registries trust the
# workflow that started the run (release-please.yml, or packages.yml when run by hand). See packaging/README.md.
name: Packages
on:
  workflow_call:
    inputs:
      version:
        description: Release version without the v prefix, for example 0.1.1
        required: true
        type: string
    secrets:
      NPM_TOKEN:
        description: Optional granular npm token. Releases use trusted publishing; see packaging/README.md
        required: false
  workflow_dispatch:
    inputs:
      version:
        description: Release version without the v prefix, for example 0.1.1
        required: true
        type: string
permissions: {}
concurrency:
  group: packages-${{ inputs.version }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      public: ${{ steps.visibility.outputs.public }}
    steps:
      - id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          version="${INPUT_VERSION#v}"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "version must be X.Y.Z, got $INPUT_VERSION" >&2; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - id: visibility
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          private=$(gh api "repos/$GITHUB_REPOSITORY" --jq .private)
          if [ "$private" = "false" ]; then echo "public=true" >> "$GITHUB_OUTPUT"; else echo "public=false" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492 # v5.0.1
        with:
          version: 2026.9.11
          cache: true
      - name: Download the release assets
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p "$RUNNER_TEMP/assets"
          gh release download "v$VERSION" --repo "$GITHUB_REPOSITORY" --dir "$RUNNER_TEMP/assets" \
            --pattern 'headroom-*.tar.gz' --pattern SHA256SUMS
      - name: Build the npm packages and tarballs
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mise exec -- bun scripts/package-npm.ts --version "$VERSION" --assets "$RUNNER_TEMP/assets" --out "$RUNNER_TEMP/npm"
          mkdir -p dist-packages/npm
          # Tarballs keep the binary's exec bit, which an artifact upload of loose files would drop.
          for dir in "$RUNNER_TEMP"/npm/*/; do
            (cd "$dir" && npm pack --pack-destination "$GITHUB_WORKSPACE/dist-packages/npm")
          done
      - name: Build the wheels
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mise exec -- bun scripts/package-readme.ts --version "$VERSION" --out "$RUNNER_TEMP/README.md"
          python3 -I scripts/package-pypi.py --version "$VERSION" --assets "$RUNNER_TEMP/assets" --out dist-packages/pypi --readme "$RUNNER_TEMP/README.md"
      - run: ls -l dist-packages/npm dist-packages/pypi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: npm-packages
          path: dist-packages/npm
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pypi-wheels
          path: dist-packages/pypi
          if-no-files-found: error

  npm:
    needs: build
    if: vars.NPM_PUBLISH == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.21.0
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: npm-packages
          path: packages
      # Platform packages first, so headroomhq never points at a version that is not yet published.
      # npm uses trusted publishing (OIDC): each package trusts release-please.yml and packages.yml.
      - name: Publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          VERSION: ${{ needs.build.outputs.version }}
          PUBLIC: ${{ needs.build.outputs.public }}
        run: |
          provenance=()
          if [ "$PUBLIC" = "true" ]; then provenance=(--provenance); fi
          for name in headroomhq-darwin-arm64 headroomhq-darwin-x64 headroomhq-linux-x64 headroomhq-linux-arm64 headroomhq; do
            if npm view "$name@$VERSION" version >/dev/null 2>&1; then
              echo "$name@$VERSION is already published; skipping"
              continue
            fi
            npm publish "packages/$name-$VERSION.tgz" --access public "${provenance[@]}"
          done

  pypi:
    needs: build
    if: vars.PYPI_PUBLISH == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: pypi-wheels
          path: dist
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          skip-existing: true
          attestations: ${{ needs.build.outputs.public }}
