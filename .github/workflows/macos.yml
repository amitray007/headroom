# Owner publishing only: release-please calls this for apps/macos, or dispatch an existing draft.
name: macOS
on:
  pull_request:
    paths:
      - apps/macos/**
      - scripts/app-contract.ts
      - scripts/render-cask*.ts
      - scripts/mac-release.sh
      - mise.toml
      - .github/workflows/macos.yml
  push:
    branches: [main]
    paths:
      - apps/macos/**
      - scripts/app-contract.ts
      - scripts/render-cask*.ts
      - scripts/mac-release.sh
      - mise.toml
      - .github/workflows/macos.yml
  workflow_call:
    inputs:
      version:
        description: Mac release version without macos-v, such as 0.1.1
        type: string
        required: true
  workflow_dispatch:
    inputs:
      version:
        description: Existing Mac release version without macos-v, such as 0.1.1
        type: string
        required: true
permissions: {}
concurrency:
  # Serialize release versions so cask bot commits cannot race each other.
  group: macos-${{ inputs.version && 'release' || github.ref }}
  cancel-in-progress: ${{ !inputs.version }}
defaults:
  run:
    shell: bash
jobs:
  ci:
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && !inputs.version)
    runs-on: macos-26
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Xcode 26.2 (17C52), Swift 6.2.3; fail if the runner stops providing this pin.
      # https://github.com/actions/runner-images/blob/main/images/macos/macos-26-arm64-Readme.md
      - name: Select Xcode 26.2
        run: |
          sudo xcode-select -s /Applications/Xcode_26.2.app/Contents/Developer
          xcodebuild -version
          swift --version
      - uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492 # v5.0.1
        with:
          version: 2026.9.11
          cache: true
      - run: mise run mac:test
      - run: mise run mac:build

  build-release:
    if: inputs.version != '' && github.ref == 'refs/heads/main'
    runs-on: macos-26
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      VERSION: ${{ inputs.version }}
    steps:
      - name: Check the version
        run: '[[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: macos-v${{ inputs.version }}
          persist-credentials: false
      - name: Select Xcode 26.2
        run: |
          sudo xcode-select -s /Applications/Xcode_26.2.app/Contents/Developer
          xcodebuild -version
          swift --version
      - uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492 # v5.0.1
        with:
          version: 2026.9.11
          cache: true
      - run: mise run mac:test
      - name: Build Release for Apple silicon and Intel
        run: |
          version=$(cat apps/macos/version.txt)
          test "$version" = "$VERSION"
          xcodebuild -skipPackagePluginValidation \
            -project apps/macos/Headroom.xcodeproj -scheme Headroom \
            -configuration Release -derivedDataPath apps/macos/.derived-data \
            -destination 'generic/platform=macOS' \
            ARCHS='arm64 x86_64' ONLY_ACTIVE_ARCH=NO \
            MARKETING_VERSION="$version" CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" \
            CODE_SIGN_IDENTITY=- build
      - name: Verify, sign and package
        run: |
          app=apps/macos/.derived-data/Build/Products/Release/Headroom.app
          widget="$app/Contents/PlugIns/HeadroomWidgets.appex"
          for binary in "$app/Contents/MacOS/Headroom" "$widget/Contents/MacOS/HeadroomWidgets"; do
            for arch in arm64 x86_64; do
              xcrun lipo "$binary" -verify_arch "$arch"
            done
          done
          for bundle in "$app" "$widget"; do
            test "$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' "$bundle/Contents/Info.plist")" = "$VERSION"
            test "$(/usr/libexec/PlistBuddy -c 'Print CFBundleVersion' "$bundle/Contents/Info.plist")" = "$GITHUB_RUN_NUMBER"
          done
          # Keep the widget's sandbox entitlement when replacing its ad-hoc signature.
          codesign --force --deep -s - --preserve-metadata=entitlements,requirements,flags "$app"
          codesign --verify --deep --strict "$app"
          codesign -d --entitlements - --xml "$widget" > "$RUNNER_TEMP/widget-entitlements.plist"
          test "$(/usr/libexec/PlistBuddy -c 'Print com.apple.security.app-sandbox' "$RUNNER_TEMP/widget-entitlements.plist")" = true
          mkdir -p "$RUNNER_TEMP/mac-release"
          ditto -c -k --keepParent "$app" "$RUNNER_TEMP/mac-release/Headroom-$VERSION.zip"
          cd "$RUNNER_TEMP/mac-release"
          shasum -a 256 "Headroom-$VERSION.zip" > SHA256SUMS
          shasum -a 256 -c SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: headroom-mac-${{ inputs.version }}
          path: ${{ runner.temp }}/mac-release/*
          if-no-files-found: error
          retention-days: 7

  release:
    needs: build-release
    runs-on: macos-26
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      VERSION: ${{ inputs.version }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      HOMEBREW_NO_AUTO_UPDATE: 1
      HOMEBREW_NO_ANALYTICS: 1
    steps:
      # Same main-branch bot commit and rebase pattern as homebrew.yml: the release bot deploy key may push
      # to main past the ruleset, and [skip ci] keeps the push from starting other workflows.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          ssh-key: ${{ secrets.RELEASE_DEPLOY_KEY }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: headroom-mac-${{ inputs.version }}
          path: ${{ runner.temp }}/mac-release
      - uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492 # v5.0.1
        with:
          version: 2026.9.11
          cache: true
      - name: Publish complete assets and restore server latest
        run: bash scripts/mac-release.sh "$VERSION" "$RUNNER_TEMP/mac-release"
      - name: Render the cask
        run: |
          mkdir -p Casks
          mise exec -- bun scripts/render-cask.ts "$VERSION" "$RUNNER_TEMP/mac-release/SHA256SUMS" > Casks/headroom-mac.rb
      - name: Smoke-test the cask
        run: |
          brew install --cask ./Casks/headroom-mac.rb
          app=/Applications/Headroom.app
          xattr -lr "$app" > "$RUNNER_TEMP/headroom-xattrs"
          if grep -q com.apple.quarantine "$RUNNER_TEMP/headroom-xattrs"; then
            echo '::error::Quarantine remains after cask postflight'
            exit 1
          fi
          codesign --verify --deep --strict "$app"
          test "$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' "$app/Contents/Info.plist")" = "$VERSION"
          open "$app"
          sleep 5
          pgrep -x Headroom
          osascript -e 'tell application id "club.theblank.headroom.mac" to quit'
      - name: Commit and push the cask
        run: |
          if git diff --quiet -- Casks/headroom-mac.rb && [ -z "$(git ls-files --others --exclude-standard Casks/headroom-mac.rb)" ]; then
            echo "::notice::Casks/headroom-mac.rb is already at $VERSION."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/headroom-mac.rb
          git commit -m "chore(brew): headroom-mac $VERSION [skip ci]"
          for attempt in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep $((attempt * 5))
          done
          exit 1
