# Publishes ghcr.io/<owner>/headroom. A push to main publishes `edge`; a release publishes
# X.Y.Z, X.Y, X (from 1.0) and `latest`. The image is pushed under `sha-<short>` first and
# gets its public tags only after the smoke test passes. See docs/operations/releases.md.
# Every build installs the current sign-in CLIs (Codex latest, Claude Code stable, Grok stable); the smoke
# test starts and cancels a sign-in with each, so a CLI release that breaks sign-in never gets a public tag.
name: Image
on:
  push:
    branches: [main]
  workflow_call:
    inputs:
      version:
        description: Release version without the v, such as 0.4.2
        type: string
        required: true
  workflow_dispatch:
permissions: {}
concurrency:
  group: image-${{ inputs.version || github.ref }}
  cancel-in-progress: ${{ !inputs.version }}
env:
  IMAGE: ghcr.io/${{ github.repository }}
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
      codex: ${{ steps.clis.outputs.codex }}
      claude: ${{ steps.clis.outputs.claude }}
      grok: ${{ steps.clis.outputs.grok }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Codex has no stable channel, so its latest release; Claude Code's stable channel trails latest by
      # about a week and skips releases with regressions. Grok's checksums are taken here and checked again
      # in the build, so both architectures install the bytes hashed here.
      - name: Resolve the sign-in CLIs
        id: clis
        run: |
          set -euo pipefail
          semver='^[0-9]+\.[0-9]+\.[0-9]+$'
          codex=$(npm view @openai/codex@latest version)
          claude=$(npm view @anthropic-ai/claude-code@stable version)
          grok=$(curl -fsSL https://x.ai/cli/stable | tr -d '[:space:]')
          for version in "$codex" "$claude" "$grok"; do
            [[ "$version" =~ $semver ]] || { echo "unexpected version: $version" >&2; exit 1; }
          done
          tmp=$(mktemp -d)
          for arch in x86_64 aarch64; do
            curl -fsSL -o "$tmp/grok-$arch" "https://x.ai/cli/grok-${grok}-linux-${arch}"
          done
          {
            echo "codex=$codex"
            echo "claude=$claude"
            echo "grok=$grok"
            echo "grok_amd64=$(sha256sum "$tmp/grok-x86_64" | cut -d' ' -f1)"
            echo "grok_arm64=$(sha256sum "$tmp/grok-aarch64" | cut -d' ' -f1)"
          } >> "$GITHUB_OUTPUT"
          rm -rf "$tmp"
          echo "Sign-in CLIs: Codex $codex, Claude Code $claude, Grok $grok" >> "$GITHUB_STEP_SUMMARY"
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: type=sha,prefix=sha-,format=short
          labels: |
            org.opencontainers.image.title=Headroom
            org.opencontainers.image.version=${{ inputs.version || 'edge' }}
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            CODEX_VERSION=${{ steps.clis.outputs.codex }}
            CLAUDE_CODE_VERSION=${{ steps.clis.outputs.claude }}
            GROK_VERSION=${{ steps.clis.outputs.grok }}
            GROK_SHA256_AMD64=${{ steps.clis.outputs.grok_amd64 }}
            GROK_SHA256_ARM64=${{ steps.clis.outputs.grok_arm64 }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

  smoke:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: read
    env:
      REF: ${{ needs.build.outputs.digest }}
      EXPECTED: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: scripts/smoke.ts
          sparse-checkout-cone-mode: false
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Each architecture runs by its own manifest digest: Docker refuses to pull a second platform
      # under the same multi-arch digest.
      - name: Print the version on both architectures
        run: |
          for arch in amd64 arm64; do
            digest=$(docker buildx imagetools inspect --raw "$IMAGE@$REF" \
              | jq -r --arg arch "$arch" '.manifests[] | select(.platform.os == "linux" and .platform.architecture == $arch) | .digest')
            out=$(docker run --rm "$IMAGE@$digest" --version)
            echo "$arch: $out"
            if [[ -n "$EXPECTED" && "$out" != "headroom $EXPECTED" ]]; then
              echo "expected headroom $EXPECTED" >&2
              exit 1
            fi
            if [[ "$arch" == amd64 ]]; then echo "AMD64=$digest" >> "$GITHUB_ENV"; fi
          done
      - name: Check the sign-in CLI versions
        env:
          CODEX: ${{ needs.build.outputs.codex }}
          CLAUDE: ${{ needs.build.outputs.claude }}
          GROK: ${{ needs.build.outputs.grok }}
        run: |
          set -euo pipefail
          check() { # check <command> <version>
            out=$(docker run --rm --entrypoint "$1" "$IMAGE@$AMD64" --version)
            echo "$1: $out"
            [[ "$out" == *"$2"* ]] || { echo "expected $1 $2" >&2; exit 1; }
          }
          check codex "$CODEX"
          check claude "$CLAUDE"
          check grok "$GROK"
      - name: Start with no settings and answer the health check
        run: |
          docker run -d --name headroom -p 8080:8080 -e HEADROOM_PUBLIC_URL=http://localhost:8080 "$IMAGE@$AMD64"
          for _ in $(seq 1 30); do
            if body=$(curl -fsS http://127.0.0.1:8080/healthz); then
              echo "$body"
              exit 0
            fi
            sleep 1
          done
          docker logs headroom
          exit 1
      # Uses the image's own Bun, so the runner needs no toolchain.
      - name: Start and cancel a sign-in with each CLI
        run: |
          docker run --rm --network host -e HEADROOM_SMOKE_URL=http://localhost:8080 \
            -v "$PWD/scripts/smoke.ts:/smoke/smoke.ts:ro" --entrypoint bun "$IMAGE@$AMD64" \
            /smoke/smoke.ts codex claude grok || { docker logs headroom; exit 1; }

  publish:
    needs: [build, smoke]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=false
          tags: |
            type=raw,value=edge,enable=${{ !inputs.version }}
            type=semver,pattern={{version}},value=v${{ inputs.version }},enable=${{ !!inputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=v${{ inputs.version }},enable=${{ !!inputs.version }}
            type=semver,pattern={{major}},value=v${{ inputs.version }},enable=${{ !!inputs.version && !startsWith(inputs.version, '0.') }}
            type=raw,value=latest,enable=${{ !!inputs.version }}
      - name: Add the public tags to the tested image
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          REF: ${{ needs.build.outputs.digest }}
        run: |
          args=()
          while IFS= read -r tag; do
            [[ -n "$tag" ]] && args+=(-t "$tag")
          done <<< "$TAGS"
          docker buildx imagetools create "${args[@]}" "$IMAGE@$REF"
          printf '%s\n' "$TAGS"
