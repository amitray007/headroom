# Publishes ghcr.io/<owner>/headroom. A push to main publishes `edge`; a release publishes
# X.Y.Z, X.Y, X (from 1.0) and `latest`. The image is pushed under `sha-<short>` first and
# gets its public tags only after the smoke test passes. See docs/operations/releases.md.
name: Image
on:
  push:
    branches: [main]
  workflow_call:
    inputs:
      version:
        description: Release version without the v, such as 0.4.2
        type: string
        required: true
  workflow_dispatch:
permissions: {}
concurrency:
  group: image-${{ inputs.version || github.ref }}
  cancel-in-progress: ${{ !inputs.version }}
env:
  IMAGE: ghcr.io/${{ github.repository }}
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: type=sha,prefix=sha-,format=short
          labels: |
            org.opencontainers.image.title=Headroom
            org.opencontainers.image.version=${{ inputs.version || 'edge' }}
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

  smoke:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: read
    env:
      REF: ${{ needs.build.outputs.digest }}
      EXPECTED: ${{ inputs.version }}
    steps:
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Print the version on both architectures
        run: |
          for platform in linux/amd64 linux/arm64; do
            out=$(docker run --rm --platform "$platform" "$IMAGE@$REF" --version)
            echo "$platform: $out"
            if [[ -n "$EXPECTED" && "$out" != "headroom $EXPECTED" ]]; then
              echo "expected headroom $EXPECTED" >&2
              exit 1
            fi
          done
      - name: Start with no settings and answer the health check
        run: |
          docker run -d --name headroom -p 8080:8080 --platform linux/amd64 "$IMAGE@$REF"
          for _ in $(seq 1 30); do
            if body=$(curl -fsS http://127.0.0.1:8080/healthz); then
              echo "$body"
              exit 0
            fi
            sleep 1
          done
          docker logs headroom
          exit 1

  publish:
    needs: [build, smoke]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=false
          tags: |
            type=raw,value=edge,enable=${{ !inputs.version }}
            type=semver,pattern={{version}},value=v${{ inputs.version }},enable=${{ !!inputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=v${{ inputs.version }},enable=${{ !!inputs.version }}
            type=semver,pattern={{major}},value=v${{ inputs.version }},enable=${{ !!inputs.version && !startsWith(inputs.version, '0.') }}
            type=raw,value=latest,enable=${{ !!inputs.version }}
      - name: Add the public tags to the tested image
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          REF: ${{ needs.build.outputs.digest }}
        run: |
          args=()
          while IFS= read -r tag; do
            [[ -n "$tag" ]] && args+=(-t "$tag")
          done <<< "$TAGS"
          docker buildx imagetools create "${args[@]}" "$IMAGE@$REF"
          printf '%s\n' "$TAGS"
