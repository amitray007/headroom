# Requires a "Showcase" section in a pull request that changes the interface or behaviour (D50).
# It reads only the description and the changed file names.
# Editing the description or a label re-runs it. See CONTRIBUTING.md#showcase-your-change.
name: Showcase
on:
  pull_request:
    types: [opened, edited, synchronize, reopened, labeled, unlabeled]
permissions: {}
concurrency:
  group: showcase-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  showcase:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492 # v5.0.1
        with:
          version: 2026.9.11
          cache: true
      - name: List changed files
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR/files" --jq '.[].filename' > "$RUNNER_TEMP/files.txt"
      - name: Check the Showcase section
        run: bun scripts/pr-showcase.ts "$RUNNER_TEMP/files.txt"
