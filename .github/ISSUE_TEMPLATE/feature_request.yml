name: Feature or provider request
description: Suggest an improvement, a new metric, or a new provider.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to see or do that Headroom does not support yet?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Your idea
      description: How it could work. For a provider, link where its usage is shown and any public API docs.
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched existing issues first.
          required: true
        - label: This request contains no tokens, cookies or personal account data.
          required: true
