<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Headroom · Timeline</title>
    <link rel="stylesheet" href="app.css" />
    <link rel="stylesheet" href="g-views.css" />
    <link rel="stylesheet" href="g-timeline.css" />
  </head>
  <body>
    <div class="page tl-page">
      <header class="top"></header>
      <div class="tl-tools">
        <h2 id="tl-range" class="tl-range" aria-live="polite"></h2>
        <div class="tl-ctl">
          <div class="tl-step" role="group" aria-label="Range">
            <button type="button" id="prev" aria-label="Earlier">
              <svg
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
                focusable="false"
              >
                <path d="m15 6-6 6 6 6" />
              </svg>
            </button>
            <button type="button" id="today">Today</button>
            <button type="button" id="next" aria-label="Later">
              <svg
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
                focusable="false"
              >
                <path d="m9 6 6 6-6 6" />
              </svg>
            </button>
          </div>
          <div class="seg" role="group" aria-label="Window Type" id="kinds"></div>
          <div class="seg" role="group" aria-label="Show Limits As" id="views">
            <button type="button" data-view="used" aria-pressed="true">Used</button>
            <button type="button" data-view="left" aria-pressed="false">Left</button>
          </div>
        </div>
      </div>

      <div id="chart" class="tl-chart" aria-label="Quota window timeline">
        <div class="tl-body"></div>
      </div>
      <div id="list" class="tl-list" aria-label="Quota windows by account">
        <div class="tl-body"></div>
      </div>

      <div class="tl-legend" aria-label="Legend">
        <span><i class="tl-lg tl-cur"></i>Current Window</span>
        <span><i class="tl-lg tl-passed"></i>Time Passed</span>
        <span><i class="tl-lg tl-next"></i>Next Window</span>
        <span><i class="tl-lg tl-prev"></i>Earlier</span>
        <span><i class="tl-lg tl-keybank"></i>Banked Reset Expires</span>
        <span class="tl-tones"
          ><i class="tl-dot t-good"></i>Plenty Left <i class="tl-dot t-warn"></i>Running Low
          <i class="tl-dot t-bad"></i>Almost Out</span
        >
      </div>

      <div class="tl-pair">
        <section class="tl-card" aria-labelledby="next-title">
          <h2 id="next-title">Up Next</h2>
          <div id="upnext" class="tl-card-body"></div>
        </section>
        <section class="tl-card" aria-labelledby="saved-title">
          <h2 id="saved-title">Watch List</h2>
          <div id="saved" class="tl-card-body"></div>
        </section>
      </div>
    </div>

    <script type="module">
      import * as shell from "./g-shell.js";
      import {
        now,
        accounts as accountsAll,
        D,
        H,
        KINDS,
        kindOf,
        limitName,
        wd,
        hhmm,
        shortDay,
        when,
        startOfDay,
        lanesFor,
      } from "./g-timeline-data.js";

      shell.renderShell({ active: "timeline" });
      const { providers, brandMark, statusPill, countdown, ago, tone, display, esc, isLive } =
        shell;
      const MIN = 60_000;
      const providerName = (id) => providers.find((p) => p.id === id)?.name ?? id;
      const plural = (n, w) => `${n} ${w}${n === 1 ? "" : "s"}`;
      const clamp = (v, lo, hi) => Math.min(hi, Math.max(lo, v));

      /* Used or Left: the app setting when set, Used by default in this mockup. */
      const VIEW_KEY = "headroom.limitsView";
      const savedView = () => {
        try {
          return localStorage.getItem(VIEW_KEY) === "left" ? "left" : "used";
        } catch {
          return "used";
        }
      };

      const AXES = {
        weekly: {
          span: 14 * D,
          cols: 14,
          step: 7 * D,
          base: () => startOfDay(now) - 7 * D,
          size: "14 Days",
          stepWord: "Week",
        },
        "5h": {
          span: 24 * H,
          cols: 12,
          step: D,
          base: () => startOfDay(now) + 6 * H,
          size: "24 Hours",
          stepWord: "Day",
        },
        cycle: {
          span: 70 * D,
          cols: 10,
          step: 28 * D,
          base: () => startOfDay(now) - 28 * D,
          size: "10 Weeks",
          stepWord: "4 Weeks",
        },
      };

      const state = { kind: "weekly", step: 0, view: savedView() };

      /* ---------- Popover content, kept out of the markup ---------- */
      const tips = new Map();
      let tipN = 0;
      const tip = (t) => {
        const id = `t${tipN++}`;
        tips.set(id, t);
        return id;
      };
      const tipLabel = (id) => {
        const t = tips.get(id);
        return [t.title, t.when, ...t.lines.map((l) => l.text)].filter(Boolean).join(". ");
      };
      const tipHTML = (t) =>
        `<strong>${esc(t.title)}</strong>${t.when ? `<span class="tl-when">${esc(t.when)}</span>` : ""}${t.lines
          .map(
            (l) =>
              `<span class="tl-line"${l.tone ? ` data-tone="${l.tone}"` : ""}>${l.tone ? "<i></i>" : ""}${esc(l.text)}</span>`,
          )
          .join("")}`;

      /* ---------- Labels ---------- */
      const resetShort = (kind, t) =>
        kind === "weekly" ? `${wd(t)} ${hhmm(t)}` : kind === "5h" ? hhmm(t) : shortDay(t);
      const inFuture = (t) => `${countdown((t - now) / MIN)}`;
      const shown = (used) => display(used, state.view);
      const viewWord = () => (state.view === "used" ? "Used" : "Left");

      /* ---------- One window bar ---------- */
      function winHTML({ cls, box, t, text, tipId, elapsed = 0, strip = null }) {
        const cut = `${box.cutL ? " tl-cut-l" : ""}${box.cutR ? " tl-cut-r" : ""}`;
        return `<button type="button" class="tl-win ${cls}${t ? ` t-${t}` : ""}${cut}" style="left:${box.left}%;width:${box.width}%" data-tip="${tipId}" aria-label="${esc(tipLabel(tipId))}">${
          elapsed > 0 ? `<span class="tl-el" style="width:${elapsed}%"></span>` : ""
        }<span class="tl-txt">${esc(text)}</span>${
          strip !== null ? `<span class="tl-strip"><i style="width:${strip}%"></i></span>` : ""
        }</button>`;
      }

      /** Bars and ticks for one lane. `place(s, e)` maps a span to the visible box, or null. */
      function laneParts(lane, place, pos) {
        const { account, kind } = lane;
        const K = KINDS[kind];
        const name = `${providerName(account.provider)} · ${account.name}`;
        const out = [];
        const stale = isLive(account) ? [] : [{ text: `Numbers from ${ago(account.refreshed)}` }];

        if (lane.prev && kind !== "5h") {
          const box = place(lane.prev.start, lane.prev.end);
          if (box)
            out.push(
              winHTML({
                cls: "tl-prev",
                box,
                text: `Ended ${shortDay(lane.prev.end)}`,
                tipId: tip({
                  title: `${name} · ${K.label}`,
                  when: `Earlier window · ended ${when(lane.prev.end)}`,
                  lines: [
                    { text: `Opened ${when(lane.prev.start)}` },
                    { text: "Worked out from the window length" },
                  ],
                }),
              }),
            );
        }

        const cur = place(lane.start, lane.end);
        if (cur && lane.notStarted) {
          out.push(
            winHTML({
              cls: "tl-idle",
              box: cur,
              text: "Not Started",
              tipId: tip({
                title: `${name} · ${K.label}`,
                when: "Not Started",
                lines: [{ text: "Opens when you next use it" }, ...stale],
              }),
            }),
          );
        } else if (cur) {
          const t = lane.used === null ? null : tone(lane.used);
          const d = lane.used === null ? null : shown(lane.used);
          const el = clamp((now - cur.vs) / (cur.ve - cur.vs), 0, 1) * 100;
          const passed = clamp((now - lane.start) / (lane.end - lane.start), 0, 1);
          out.push(
            winHTML({
              cls: "tl-cur",
              box: cur,
              t,
              elapsed: el,
              strip: d ? clamp(d.fill, 0, 100) : null,
              text: `${d ? `${d.text}% ${viewWord()}` : "Not Reported"} · ${resetShort(kind, lane.end)}`,
              tipId: tip({
                title: `${name} · ${K.label}`,
                when: `Resets in ${inFuture(lane.end)} · ${when(lane.end)}`,
                lines: [
                  ...lane.meters.map((m) => {
                    const md = m.used === null ? null : shown(m.used);
                    return {
                      text: `${md ? `${md.text}% ${viewWord()}` : "Not reported"} · ${m.window === K.label ? m.label : `${m.label} ${m.window}`}`,
                      tone: m.used === null ? null : tone(m.used),
                    };
                  }),
                  { text: `Opened ${when(lane.start)}` },
                  { text: `${Math.round(passed * 100)}% of the window has passed` },
                  ...stale,
                ],
              }),
            }),
          );
        }

        if (lane.next) {
          const box = place(lane.next.start, lane.next.end);
          if (box)
            out.push(
              winHTML({
                cls: "tl-next",
                box,
                text: kind === "5h" ? "Starts On Next Use" : `Next · ${shortDay(lane.next.end)}`,
                tipId: tip({
                  title: `${name} · ${K.label}`,
                  when: `Next window · ${kind === "5h" ? "starts on next use" : `opens ${when(lane.next.start)}`}`,
                  lines: [
                    ...(kind === "5h" ? [] : [{ text: `Resets ${when(lane.next.end)}` }]),
                    { text: "Opens when this one resets" },
                  ],
                }),
              }),
            );
        }

        for (const b of lane.banks) {
          const x = pos(b.t);
          if (x === null) continue;
          const id = tip({
            title: `${name} · ${b.label} Expires`,
            when: `Expires in ${inFuture(b.t)} · ${when(b.t)}`,
            lines: [{ text: `${b.i + 1} of ${b.count} banked` }],
          });
          out.push(
            `<button type="button" class="tl-tick" style="left:${x}%" data-tip="${id}" aria-label="${esc(tipLabel(id))}"><i></i></button>`,
          );
        }
        return out.join("");
      }

      /* ---------- Left column: name, plan, identity, limit chips ---------- */
      function whoHTML(lane) {
        const a = lane.account;
        const chips = a.meters
          .map((m) => {
            const on = kindOf(m) === lane.kind;
            const d = m.used === null ? null : shown(m.used);
            const t = m.used === null ? "" : tone(m.used);
            return `<span class="tl-chip${on ? " tl-on" : ""}">${t ? `<i class="tl-dot t-${t}"></i>` : ""}${esc(limitName(m))} <b>${d ? `${d.text}%` : m.notStarted ? "Not Started" : "—"}</b></span>`;
          })
          .join("");
        return `<div class="tl-who-cell">
          <div class="tl-id"><span class="tl-nm">${esc(a.name)}${a.plan ? `<span class="tl-plan"> · ${esc(a.plan)}</span>` : ""}</span>${a.status === "active" ? "" : statusPill(a.status)}</div>
          ${a.identity ? `<div class="who tl-ident">${esc(a.identity)}</div>` : ""}
          <div class="tl-chips">${chips}</div>
        </div>`;
      }

      const groupHTML = (p, n) =>
        `<div class="tl-grp">${brandMark(p.id)}<b>${esc(p.name)}</b><span>${plural(n, "Account")}</span></div>`;

      /* ---------- Desktop grid ---------- */
      function chartHTML(lanes, ax) {
        const base = ax.base;
        const end = base + ax.span;
        const pos = (t) => (t < base || t > end ? null : ((t - base) / ax.span) * 100);
        const place = (s, e) => {
          const vs = Math.max(s, base);
          const ve = Math.min(e, end);
          if (ve <= vs) return null;
          return {
            left: ((vs - base) / ax.span) * 100,
            width: ((ve - vs) / ax.span) * 100,
            cutL: s < base,
            cutR: e > end,
            vs,
            ve,
          };
        };
        const colLen = ax.span / ax.cols;
        const cols = Array.from({ length: ax.cols }, (_, i) => {
          const t = base + i * colLen;
          const isNow = now >= t && now < t + colLen;
          let top;
          let bottom;
          if (state.kind === "weekly") {
            top = wd(t);
            bottom = shortDay(t);
          } else if (state.kind === "5h") {
            const midnight = new Date(t).getHours() === 0;
            top = i === 0 || midnight ? `${wd(t)} ${new Date(t).getDate()}` : "";
            bottom = hhmm(t);
          } else {
            top = "Week of";
            bottom = shortDay(t);
          }
          return `<div class="tl-col${isNow ? " tl-today" : ""}"><span>${top}</span><b>${bottom}</b></div>`;
        }).join("");

        const nowX = pos(now);
        const colNow = Math.floor((now - base) / colLen);
        let rows = "";
        let i = 0;
        for (const p of providers) {
          const ls = lanes.filter((l) => l.account.provider === p.id);
          if (ls.length === 0) continue;
          rows += groupHTML(p, ls.length);
          for (const lane of ls) {
            const dim = !isLive(lane.account);
            rows += `<div class="tl-row${dim ? " tl-dim" : ""}" style="--i:${i++}">${whoHTML(lane)}<div class="tl-track"><div class="tl-bars">${laneParts(lane, place, pos)}</div></div></div>`;
          }
        }
        return `<div class="tl-hrow"><div class="tl-corner">Account<span>Limits · ${viewWord()}</span></div><div class="tl-cols">${cols}</div></div>
          ${rows}
          <div class="tl-plot" aria-hidden="true">${
            colNow >= 0 && colNow < ax.cols
              ? `<span class="tl-todaycol" style="left:${(colNow / ax.cols) * 100}%;width:${100 / ax.cols}%"></span>`
              : ""
          }${nowX === null ? "" : `<span class="tl-nowline" style="left:${nowX}%"><b>Now</b></span>`}</div>`;
      }

      /* ---------- Phone list: one mini timeline per account ---------- */
      function listHTML(lanes) {
        let out = "";
        let i = 0;
        for (const p of providers) {
          const ls = lanes.filter((l) => l.account.provider === p.id);
          if (ls.length === 0) continue;
          out += groupHTML(p, ls.length);
          for (const lane of ls) {
            const base = lane.start;
            const span = lane.notStarted ? lane.len : lane.len * 2;
            const end = base + span;
            const pos = (t) => (t < base || t > end ? null : ((t - base) / span) * 100);
            const place = (s, e) => {
              const vs = Math.max(s, base);
              const ve = Math.min(e, end);
              if (ve <= vs) return null;
              return {
                left: ((vs - base) / span) * 100,
                width: ((ve - vs) / span) * 100,
                cutL: false,
                cutR: false,
                vs,
                ve,
              };
            };
            const nx = lane.notStarted ? null : pos(now);
            const dim = !isLive(lane.account);
            const reset = lane.notStarted
              ? "Not Started · Opens when you next use it"
              : `Resets in ${inFuture(lane.end)} · ${when(lane.end)}`;
            out += `<div class="tl-mrow${dim ? " tl-dim" : ""}" style="--i:${i++}">
              ${whoHTML(lane)}
              <div class="tl-mini"><div class="tl-bars">${laneParts(lane, place, pos)}</div></div>
              <p class="tl-mcap">${esc(reset)}</p>
            </div>`;
          }
        }
        return out;
      }

      /* ---------- Up Next and Watch List ---------- */
      const WIN_WORD = { weekly: "Weekly", "5h": "5-Hour", cycle: "Cycle" };
      const upnextState = { all: false };
      const CAP = 6;

      const useMini = (used) => {
        if (used === null) return '<span class="tl-use tl-unk">Not Reported</span>';
        const d = shown(used);
        return `<span class="tl-use t-${tone(used)}"><span class="tl-mbar" aria-hidden="true"><i style="width:${clamp(d.fill, 0, 100)}%"></i></span><b>${d.text}%</b><span class="tl-sr"> ${viewWord()}</span></span>`;
      };

      function nextHTML() {
        const items = [];
        for (const kind of Object.keys(KINDS))
          for (const lane of lanesFor(kind))
            if (!lane.notStarted)
              items.push({ t: lane.end, a: lane.account, kind, used: lane.used });
        items.sort((x, y) => x.t - y.t);
        const shownItems = upnextState.all ? items : items.slice(0, CAP);
        const groups = [
          ["Next 24 Hours", (e) => e.t - now < D],
          ["This Week", (e) => e.t - now < 7 * D],
          ["Later", () => true],
        ];
        let out = "";
        let from = 0;
        for (const [label, test] of groups) {
          const rows = shownItems.slice(from).filter(test);
          if (rows.length === 0) continue;
          from += rows.length;
          out += `<h3 class="tl-sub">${label}</h3><ul>${rows
            .map(
              (e) =>
                `<li class="${isLive(e.a) ? "" : "tl-dim"}" title="${esc(when(e.t))}">${brandMark(e.a.provider)}<span class="tl-what"><b>${esc(providerName(e.a.provider))} · ${esc(e.a.name)}</b><span>${WIN_WORD[e.kind]}${e.kind === "cycle" ? " Ends" : " Resets"}</span></span>${useMini(e.used)}<span class="tl-when"><b>${countdown((e.t - now) / MIN)}</b><span>${wd(e.t)} ${hhmm(e.t)}</span></span></li>`,
            )
            .join("")}</ul>`;
        }
        if (items.length > CAP)
          out += `<button type="button" class="tl-more" id="more" aria-expanded="${upnextState.all}">${upnextState.all ? "Show Fewer" : `Show All ${items.length}`}</button>`;
        return out;
      }

      const SOON = 3 * D;
      function savedHTML() {
        /* Limits at 70% used or more, with when room comes back. */
        const low = [];
        for (const a of accountsAll)
          for (const m of a.meters)
            if (m.used !== null && m.used >= 70 && m.resets !== null)
              low.push({ a, m, back: now + m.resets * MIN });
        low.sort((x, y) => y.m.used - x.m.used);
        const banks = accountsAll
          .filter((a) => a.banked && a.banked.count > 0)
          .map((a) => ({
            a,
            exp: a.banked.expiries.map((m) => now + m * MIN).sort((x, y) => x - y),
          }))
          .sort((x, y) => (x.exp[0] ?? Infinity) - (y.exp[0] ?? Infinity));

        let out = `<h3 class="tl-sub">Running Low Until</h3>`;
        out += low.length
          ? `<ul>${low
              .map(
                ({ a, m, back }) =>
                  `<li class="${isLive(a) ? "" : "tl-dim"}" title="${esc(when(back))}">${brandMark(a.provider)}<span class="tl-what"><b>${esc(providerName(a.provider))} · ${esc(a.name)}</b><span>${esc(limitName(m))} ${m.used >= 90 ? "Almost Out" : "Running Low"}</span></span>${useMini(m.used)}<span class="tl-when"><b>${countdown(m.resets)}</b><span>${wd(back)} ${hhmm(back)}</span></span></li>`,
              )
              .join("")}</ul>`
          : `<p class="tl-empty">Nothing Is Running Low.</p>`;

        out += `<h3 class="tl-sub">Saved Resets</h3>`;
        out += banks.length
          ? `<ul>${banks
              .map(({ a, exp }) => {
                const soon = exp.length > 0 && exp[0] - now < SOON;
                const unit = a.banked.label + (a.banked.count === 1 ? "" : "s");
                return `<li class="tl-bankrow${isLive(a) ? "" : " tl-dim"}">${brandMark(a.provider)}<span class="tl-what"><b>${esc(providerName(a.provider))} · ${esc(a.name)}</b><span>${a.banked.count} ${esc(unit)}${
                  exp.length ? ` · next expires in ${countdown((exp[0] - now) / MIN)}` : ""
                }</span></span>${soon ? '<span class="tl-soon">Expires Soon</span>' : ""}<span class="tl-exps">${exp
                  .map(
                    (t) =>
                      `<span class="tl-exp${t - now < SOON ? " tl-exp-soon" : ""}" title="${esc(when(t))}"><i aria-hidden="true"></i>${shortDay(t)}</span>`,
                  )
                  .join("")}</span></li>`;
              })
              .join("")}</ul>`
          : `<p class="tl-empty">No Saved Resets.</p>`;
        return out;
      }

      /* ---------- Render ---------- */
      const $ = (id) => document.getElementById(id);
      const chart = $("chart");
      const list = $("list");
      const reduce = matchMedia("(prefers-reduced-motion: reduce)");
      let firstRender = true;

      /**
       * Swap one grid's content without a collapsed frame. The old content stays on top as a
       * fading ghost, the new content fades in beneath, and the card's height animates from the old
       * value to the new one. A step slides both sideways; a mode change crossfades.
       */
      function swapBody(root, build, dir) {
        const body = root.firstElementChild;
        for (const a of [...root.getAnimations(), ...body.getAnimations()]) a.cancel();
        root.querySelectorAll(":scope > .tl-ghost").forEach((g) => g.remove());
        root.style.height = "";
        if (reduce.matches || firstRender || root.offsetParent === null) {
          build(body);
          return;
        }
        const oldH = root.getBoundingClientRect().height;
        const ghost = body.cloneNode(true);
        ghost.classList.add("tl-ghost");
        ghost.inert = true;
        ghost.setAttribute("aria-hidden", "true");
        ghost
          .querySelectorAll("[aria-describedby]")
          .forEach((n) => n.removeAttribute("aria-describedby"));
        root.append(ghost);
        build(body);
        const newH = root.getBoundingClientRect().height;
        const ease = "cubic-bezier(0.16, 1, 0.3, 1)";
        const shift = dir === "next" ? 40 : dir === "prev" ? -40 : 0;
        const rise = dir === "swap" ? 6 : 0;
        const anims = [
          body.animate(
            [
              { opacity: 0, transform: `translate(${shift}px, ${rise}px)` },
              { opacity: 1, transform: "none" },
            ],
            { duration: 380, easing: ease },
          ),
          ghost.animate(
            [
              { opacity: 1, transform: "none" },
              { opacity: 0, transform: `translate(${-shift / 2}px, 0)` },
            ],
            { duration: 220, easing: "ease-out", fill: "forwards" },
          ),
        ];
        if (Math.abs(oldH - newH) > 1)
          anims.push(
            root.animate([{ height: `${oldH}px` }, { height: `${newH}px` }], {
              duration: 380,
              easing: "cubic-bezier(0.65, 0, 0.35, 1)",
            }),
          );
        Promise.allSettled(anims.map((a) => a.finished)).then(() => {
          if (anims.some((a) => a.playState === "idle")) return;
          ghost.remove();
        });
      }

      function render(dir) {
        hideTip();
        tips.clear();
        tipN = 0;
        const ax = { ...AXES[state.kind] };
        ax.base = ax.base() + state.step * ax.step;
        const lanes = lanesFor(state.kind);
        chart.style.setProperty("--cols", ax.cols);
        swapBody(chart, (body) => (body.innerHTML = chartHTML(lanes, ax)), dir);
        swapBody(list, (body) => (body.innerHTML = listHTML(lanes)), dir);

        $("tl-range").textContent =
          `${shortDay(ax.base)} – ${shortDay(ax.base + ax.span - 1)} · ${ax.size}`;
        $("prev").setAttribute("aria-label", `Earlier, ${ax.stepWord}`);
        $("next").setAttribute("aria-label", `Later, ${ax.stepWord}`);
        $("today").setAttribute("aria-disabled", String(state.step === 0));
        $("kinds").innerHTML = Object.entries(KINDS)
          .map(
            ([k, v]) =>
              `<button type="button" data-kind="${k}" aria-pressed="${k === state.kind}">${v.label}</button>`,
          )
          .join("");
        for (const b of $("views").children)
          b.setAttribute("aria-pressed", String(b.dataset.view === state.view));
        renderCards();

        if (firstRender) {
          firstRender = false;
          if (!reduce.matches) {
            chart.classList.add("intro");
            list.classList.add("intro");
            setTimeout(() => {
              chart.classList.remove("intro");
              list.classList.remove("intro");
            }, 1400);
          }
        }
      }

      function renderCards() {
        $("upnext").innerHTML = nextHTML();
        $("saved").innerHTML = savedHTML();
      }

      /* ---------- Controls ---------- */
      $("prev").addEventListener("click", () => {
        state.step -= 1;
        render("prev");
      });
      $("next").addEventListener("click", () => {
        state.step += 1;
        render("next");
      });
      $("today").addEventListener("click", () => {
        if (state.step === 0) return;
        const dir = state.step < 0 ? "next" : "prev";
        state.step = 0;
        render(dir);
      });
      $("kinds").addEventListener("click", (e) => {
        const b = e.target.closest("[data-kind]");
        if (!b || b.dataset.kind === state.kind) return;
        state.kind = b.dataset.kind;
        state.step = 0;
        render("swap");
        $("kinds").querySelector(`[data-kind="${state.kind}"]`)?.focus({ preventScroll: true });
      });
      $("views").addEventListener("click", (e) => {
        const b = e.target.closest("[data-view]");
        if (!b || b.dataset.view === state.view) return;
        state.view = b.dataset.view;
        shell.setLimitsView(state.view);
        render();
      });

      /* ---------- Popover (one shared element, placed in the viewport) ---------- */
      const pop = document.createElement("div");
      pop.className = "tl-pop";
      pop.id = "tl-pop";
      pop.setAttribute("role", "tooltip");
      document.body.append(pop);
      let tipEl = null;

      function placeTip(x) {
        if (!tipEl) return;
        const r = tipEl.getBoundingClientRect();
        const w = pop.offsetWidth;
        const h = pop.offsetHeight;
        const cx = clamp(x ?? r.left + r.width / 2, r.left, r.right);
        const left = clamp(cx - w / 2, 8, innerWidth - w - 8);
        let top = r.top - h - 8;
        let below = false;
        if (top < 8) {
          top = r.bottom + 8;
          below = true;
        }
        pop.style.left = `${left}px`;
        pop.style.top = `${top}px`;
        pop.classList.toggle("tl-below", below);
      }
      function showTip(el, x) {
        const t = tips.get(el.dataset.tip);
        if (!t) return;
        if (tipEl && tipEl !== el) tipEl.removeAttribute("aria-describedby");
        tipEl = el;
        pop.innerHTML = tipHTML(t);
        el.setAttribute("aria-describedby", "tl-pop");
        pop.classList.add("tl-on");
        placeTip(x);
      }
      function hideTip() {
        tipEl?.removeAttribute("aria-describedby");
        tipEl = null;
        pop.classList.remove("tl-on");
      }
      const tipTarget = (e) =>
        e.target instanceof Element ? e.target.closest("[data-tip]") : null;
      document.addEventListener("pointerover", (e) => {
        if (e.pointerType === "touch") return;
        const el = tipTarget(e);
        if (el) showTip(el, e.clientX);
      });
      document.addEventListener("pointermove", (e) => {
        if (e.pointerType !== "touch" && tipEl && tipEl === tipTarget(e)) placeTip(e.clientX);
      });
      document.addEventListener("pointerout", (e) => {
        if (e.pointerType === "touch") return;
        const el = tipTarget(e);
        if (el && el === tipEl && !el.contains(e.relatedTarget) && document.activeElement !== el)
          hideTip();
      });
      document.addEventListener("focusin", (e) => {
        const el = tipTarget(e);
        if (el && el.matches(":focus-visible")) showTip(el);
      });
      document.addEventListener("focusout", (e) => {
        if (tipTarget(e) === tipEl) hideTip();
      });
      document.addEventListener("click", (e) => {
        const el = tipTarget(e);
        if (el) showTip(el);
        else hideTip();
      });
      document.addEventListener("keydown", (e) => {
        if (e.key === "Escape") hideTip();
      });
      addEventListener("scroll", hideTip, { passive: true });
      addEventListener("resize", hideTip);

      $("upnext").addEventListener("click", (e) => {
        if (!e.target.closest("#more")) return;
        upnextState.all = !upnextState.all;
        renderCards();
        $("more")?.focus({ preventScroll: true });
      });

      render();
    </script>
  </body>
</html>
