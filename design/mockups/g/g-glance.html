<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Headroom · Overview</title>
    <link rel="stylesheet" href="app.css" />
    <link rel="stylesheet" href="g-views.css" />
  </head>
  <body>
    <div class="page g-page">
      <header class="top"></header>
      <main>
        <div class="g-tools">
          <div class="g-chips" id="chips" role="group" aria-label="Filter by provider"></div>
          <div class="g-segs">
            <div class="seg" role="group" aria-label="Order" id="mode"></div>
            <div class="seg" role="group" aria-label="Show limits as" id="limits">
              <button type="button" data-v="left" aria-pressed="true">Left</button>
              <button type="button" data-v="used" aria-pressed="false">Used</button>
            </div>
            <button class="btn quiet sm g-arrange" type="button" data-open-settings="overview">
              <span id="arrange-ico"></span>Arrange
            </button>
          </div>
        </div>
        <div class="g-list" id="list"></div>
      </main>
    </div>
    <script type="module">
      import {
        accounts,
        providers,
        renderShell,
        brandMark,
        countdown,
        ago,
        tone,
        toneWords,
        tightest,
        display,
        bar,
        statusLine,
        resetText,
        windowName,
        providerName,
        accountDetail,
        icons,
        esc,
        pct,
        isLive,
        getLimitsView,
        setLimitsView,
        getOverviewPrefs,
        setOverviewPrefs,
        customOrder,
        ORDERS,
        growBars,
      } from "./g-shell.js";

      renderShell({ active: "overview" });

      const state = { filter: "all", view: getLimitsView(), open: new Set() };
      document.getElementById("arrange-ico").innerHTML = icons.sliders;

      /* Urgency: disconnected, almost out, out of date or failed, running low, then fine (least room first), paused last. */
      const info = (a) => {
        const t = tightest(a);
        const tn = t ? tone(t.used) : null;
        let rank = 4;
        if (a.status === "disconnected") rank = 0;
        else if (a.status === "paused") rank = 5;
        else if (tn === "bad") rank = 1;
        else if (a.status === "failed" || a.status === "stale") rank = 2;
        else if (tn === "warn") rank = 3;
        return { a, t, tone: tn, rank, room: t ? 100 - t.used : 101 };
      };
      const all = accounts.map(info);
      const byUrgency = (list) => [...list].sort((x, y) => x.rank - y.rank || x.room - y.room);

      /* ----- Rows ----- */
      function row(r, grouped) {
        const { a, t } = r;
        const open = state.open.has(a.id);
        const live = isLive(a);
        const d = t ? display(t.used, state.view) : null;
        let limit;
        if (!t) {
          limit = `<span class="g-limit"><span class="g-limit-top"><b class="muted">—</b><span class="window">Not reported</span></span>${bar(null, { thin: true })}</span>`;
        } else if (t.balance) {
          const value = t.balance.value;
          limit = `<span class="g-limit"><span class="g-limit-top"><b>${value} of ${t.balance.of}</b><span class="window">${esc(t.label)}</span></span>${bar(t.used, { thin: true, view: "left", label: `${t.label} ${value} left` })}</span>`;
        } else {
          const tn = tone(t.used);
          limit = `<span class="g-limit"><span class="g-limit-top"><b>${d.text}${d.unit}</b><span class="window">${esc(windowName(t))}</span>${toneWords[tn] ? `<span class="tone ${tn}">${toneWords[tn]}</span>` : ""}</span>${bar(t.used, { thin: true, view: state.view, label: `${windowName(t)} ${pct(t.used)}% used` })}</span>`;
        }
        const reset = !live
          ? `<span class="g-reset">Updated ${ago(a.refreshed)}</span>`
          : t
            ? `<span class="g-reset">${t.balance ? "" : resetText(t)}</span>`
            : `<span class="g-reset"></span>`;
        const plan = a.plan
          ? `<span class="plan"><span class="sep" aria-hidden="true">·</span>${esc(a.plan)}</span>`
          : "";
        const sub = [
          grouped ? "" : esc(providerName(a.provider)),
          a.identity ? `<span class="who">${esc(a.identity)}</span>` : "",
        ]
          .filter(Boolean)
          .join(" · ");
        return `<div class="g-fold g-item" data-id="${a.id}" data-provider="${a.provider}" style="view-transition-name: acct-${a.id}"><div class="g-clip">
          <article class="g-card${open ? " open" : ""}${live ? "" : " dim"}">
            <button class="g-head" type="button" aria-expanded="${open}" aria-controls="d-${a.id}">
              <span class="g-who">${brandMark(a.provider)}<span class="g-titles"><span class="g-name">${esc(a.name)}${plan}</span>${sub ? `<span class="g-sub">${sub}</span>` : ""}</span></span>
              ${limit}${reset}
              <span class="g-state">${statusLine(a)}</span>
              <span class="g-chev">${icons.chevron}</span>
            </button>
            <div class="g-drawer" id="d-${a.id}"${open ? "" : " inert"}><div class="g-drawer-in"><div class="g-body">${accountDetail(a, state.view)}</div></div></div>
          </article></div></div>`;
      }

      const list = document.getElementById("list");
      const groupHead = (p, rows) =>
        `<header class="g-group-head">${brandMark(p.id, 24)}<h2>${esc(p.name)}</h2>${rows.length > 1 ? `<span class="chip count">${rows.length} Accounts</span>` : ""}</header>`;
      const group = (provider, head, inner, extra = "") =>
        `<section class="g-fold g-group${extra}" data-provider="${provider}"><div class="g-clip">${head}${inner}</div></section>`;

      function build() {
        const prefs = getOverviewPrefs();
        const dormant = (r) => !isLive(r.a);
        const split = prefs.dormantLast;
        const tail = split ? byUrgency(all.filter(dormant)) : [];
        const pool = split ? all.filter((r) => !dormant(r)) : all;
        let html;
        if (prefs.order === "provider") {
          html = prefs.providerOrder
            .map((id) => ({
              p: providers.find((x) => x.id === id),
              rows: byUrgency(pool.filter((r) => r.a.provider === id)),
            }))
            .filter((g) => g.rows.length)
            .map((g) =>
              group(g.p.id, groupHead(g.p, g.rows), g.rows.map((r) => row(r, true)).join("")),
            )
            .join("");
        } else {
          const rows =
            prefs.order === "custom"
              ? customOrder()
                  .map((id) => pool.find((r) => r.a.id === id))
                  .filter(Boolean)
              : byUrgency(pool);
          html = rows.map((r) => row(r, false)).join("");
        }
        if (tail.length) {
          html += group(
            "*",
            `<header class="g-group-head small"><h2>Inactive</h2><span class="chip count">${tail.length} ${tail.length === 1 ? "Account" : "Accounts"}</span></header>`,
            tail.map((r) => row(r, false)).join(""),
            " g-dormant",
          );
        }
        list.innerHTML = html;
        syncMode(prefs.order);
        applyFilter();
        growBars(list);
      }

      const modeEl = document.getElementById("mode");
      modeEl.innerHTML = ORDERS.map(
        (o) => `<button type="button" data-v="${o.id}" aria-pressed="false">${o.label}</button>`,
      ).join("");
      function syncMode(order) {
        modeEl
          .querySelectorAll("[data-v]")
          .forEach((x) => x.setAttribute("aria-pressed", String(x.dataset.v === order)));
      }

      function applyFilter() {
        for (const el of list.querySelectorAll(".g-item")) {
          el.classList.toggle(
            "closed",
            state.filter !== "all" && el.dataset.provider !== state.filter,
          );
        }
        for (const el of list.querySelectorAll(".g-group")) {
          const any = [...el.querySelectorAll(".g-item")].some(
            (i) => !i.classList.contains("closed"),
          );
          el.classList.toggle("closed", !any);
          // The group's count follows the filter, so "Inactive · 1 Account" matches what is shown.
          const count = el.querySelector(".chip.count");
          if (count && el.classList.contains("g-dormant")) {
            const n = [...el.querySelectorAll(".g-item")].filter(
              (i) => !i.classList.contains("closed"),
            ).length;
            count.textContent = `${n} ${n === 1 ? "Account" : "Accounts"}`;
          }
        }
        for (const el of list.querySelectorAll(".g-fold"))
          el.inert = el.classList.contains("closed");
      }

      /* ----- Chips ----- */
      const chips = document.getElementById("chips");
      const counts = Object.fromEntries(
        providers.map((p) => [p.id, accounts.filter((a) => a.provider === p.id).length]),
      );
      chips.innerHTML =
        `<button class="g-chip" type="button" data-f="all" aria-pressed="true">All <span class="n">${accounts.length}</span></button>` +
        providers
          .filter((p) => counts[p.id])
          .map(
            (p) =>
              `<button class="g-chip" type="button" data-f="${p.id}" aria-pressed="false">${brandMark(p.id, 16)}${esc(p.name)} <span class="n">${counts[p.id]}</span></button>`,
          )
          .join("");
      chips.addEventListener("click", (e) => {
        const b = e.target.closest("[data-f]");
        if (!b) return;
        state.filter = b.dataset.f;
        chips
          .querySelectorAll("[data-f]")
          .forEach((c) => c.setAttribute("aria-pressed", String(c === b)));
        applyFilter();
      });

      /* ----- Segmented toggles ----- */
      const swap = (fn) =>
        document.startViewTransition && !matchMedia("(prefers-reduced-motion: reduce)").matches
          ? document.startViewTransition(fn)
          : fn();
      modeEl.addEventListener("click", (e) => {
        const b = e.target.closest("[data-v]");
        if (b && getOverviewPrefs().order !== b.dataset.v) setOverviewPrefs({ order: b.dataset.v });
      });
      document.getElementById("limits").addEventListener("click", (e) => {
        const b = e.target.closest("[data-v]");
        if (!b || state.view === b.dataset.v) return;
        state.view = b.dataset.v;
        setLimitsView(state.view);
        syncLimits();
        build();
      });
      function syncLimits() {
        document
          .querySelectorAll("#limits [data-v]")
          .forEach((x) => x.setAttribute("aria-pressed", String(x.dataset.v === state.view)));
      }
      syncLimits();

      /* A change from Settings (or from the order control) rebuilds the list. Behind the open dialog, skip the cross-fade. */
      window.addEventListener("headroom:settings", (e) => {
        if (e.detail.keys.includes("limits")) {
          state.view = getLimitsView();
          syncLimits();
        }
        document.getElementById("g-settings")?.open ? build() : swap(build);
      });

      /* ----- Expand a row inline ----- */
      function toggle(id, force) {
        const card = list.querySelector(`.g-item[data-id="${id}"] .g-card`);
        if (!card) return;
        const open = force ?? !card.classList.contains("open");
        card.classList.toggle("open", open);
        card.querySelector(".g-head").setAttribute("aria-expanded", String(open));
        card.querySelector(".g-drawer").inert = !open;
        open ? state.open.add(id) : state.open.delete(id);
        if (open) {
          card.querySelectorAll(".bar.pre").forEach((b) => b.classList.remove("pre"));
        }
      }
      list.addEventListener("click", (e) => {
        const head = e.target.closest(".g-head");
        if (head) toggle(head.closest(".g-item").dataset.id);
      });
      build();
    </script>
  </body>
</html>
