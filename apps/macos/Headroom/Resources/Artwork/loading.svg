<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" role="img" aria-labelledby="title"><title id="title">Account tile assembling</title><style>:root{color-scheme:light dark;--ink:light-dark(oklch(16% 0 0),oklch(96% 0 0));--face:light-dark(oklch(97% 0 0),oklch(26% 0 0));--top:light-dark(oklch(100% 0 0),oklch(40% 0 0));--side:light-dark(oklch(82% 0 0),oklch(29.5% 0 0));--muted:light-dark(oklch(55% 0 0),oklch(63% 0 0));--danger:light-dark(oklch(54% .21 25),oklch(75% .19 25));color:var(--ink)}.face{fill:var(--face)}.top{fill:var(--top)}.side{fill:var(--side)}.ink{fill:currentColor;stroke:none}.muted{fill:var(--muted);stroke:none}.wrong{stroke:var(--danger)}.bad{fill:var(--danger);stroke:none}</style><style>.p0{transform:translateY(-16px)}.p1{transform:translateY(-8px)}</style><g stroke="currentColor" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"><path d="M103 236 245 153 397 230V254L255 338 103 260Z" class="side" /><path d="M103 236 245 153 397 230 255 314Z" class="top" /><g transform="matrix(1 .5 -.73 .42 235 126)"><rect x="0" y="0" width="190" height="190" rx="22" class="face"/><rect x="28" y="43" width="134" height="9" rx="4" class="muted"/><g class="piece p0"><rect x="28" y="83" width="134" height="23" rx="7" class="ink"/></g><g class="piece p1"><rect x="28" y="126" width="134" height="23" rx="7" class="ink"/></g></g></g></svg>